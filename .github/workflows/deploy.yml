name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pages-mode.json: "app" publishes the app here; "legacy-redirects" publishes pages that send readers to
      # f1-stories.gr/telemetry/ (see README, "Moved to f1-stories.gr").
      - id: mode
        run: |
          mode=$(jq -er .mode pages-mode.json)
          case "$mode" in app|legacy-redirects) ;; *) echo "::error file=pages-mode.json::unknown mode '$mode'"; exit 1 ;; esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run ci

      - name: Build the compatibility pages
        if: steps.mode.outputs.mode == 'legacy-redirects'
        run: |
          npm run build:legacy-redirects
          test -f dist-legacy/index.html && test -f dist-legacy/404.html

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ steps.mode.outputs.mode == 'app' && 'dist' || 'dist-legacy' }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
